<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NUESTRO · Café de Santa Bárbara</title>
<meta name="description" content="Carta de NUESTRO, Café de Santa Bárbara.">
<link rel="icon" type="image/png" href="img/icono.png">
<link rel="apple-touch-icon" href="img/icono-apple.png">
<meta name="theme-color" content="#F4ECE1">
<meta property="og:type" content="website">
<meta property="og:url" content="https://marianasuazas.github.io/Menu-NuestroCafe/">
<meta property="og:title" content="NUESTRO · Café de Santa Bárbara">
<meta property="og:description" content="Conoce nuestra carta: café de origen, bebidas, postres y productos de la región.">
<meta property="og:image" content="https://marianasuazas.github.io/Menu-NuestroCafe/img/compartir.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --crema:#F4ECE1; --papel:#FBF6EF; --rojo:#C31622; --vino:#A8141D; --vino-oscuro:#85101A;
  --cafe:#2E1D14; --grano:#6B4A35; --linea:#E3D6C6;
  --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans:"Nunito Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --script:"Allura", "Brush Script MT", cursive;
  color-scheme: light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--crema);color:var(--cafe);line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--vino);outline-offset:3px;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

/* Barra superior */
.top{position:sticky;top:0;z-index:10;background:rgba(244,236,225,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--linea);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.top .marca{font-family:var(--serif);font-weight:700;font-size:1.35rem;color:var(--vino);text-decoration:none;letter-spacing:.04em}
.top nav{display:flex;gap:22px;font-size:.92rem}
.top nav a{text-decoration:none;color:var(--grano);font-weight:600}
.top nav a:hover{color:var(--vino)}

/* Portada */
.hero{position:relative;overflow:hidden;text-align:center;padding:72px 20px 88px;background:var(--papel)}
.hero.con-foto{background:var(--cafe) center/cover no-repeat;color:#fff}
.hero.con-foto::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(46,29,20,.35),rgba(46,29,20,.7))}
.hero > *{position:relative}
.hero .montes{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;color:var(--grano);opacity:.35}
.hero.con-foto .montes{display:none}
.hero .logo{width:min(520px,88%);height:auto;margin:0 auto}
.contacto .logo{width:min(260px,70%);height:auto;margin:0 auto}
.hero h1{font-family:var(--serif);font-weight:700;color:var(--vino);font-size:clamp(3.2rem,12vw,6rem);line-height:.95;letter-spacing:.03em}
.hero.con-foto h1{color:#fff}
.hero .sub{font-family:var(--serif);font-weight:600;letter-spacing:.32em;font-size:clamp(.8rem,2.6vw,1rem);margin-top:8px;color:var(--cafe)}
.hero.con-foto .sub{color:#F4ECE1}
.hero .eslogan{font-family:var(--script);font-size:clamp(1.8rem,6vw,2.5rem);color:var(--grano);margin-top:14px}
.hero.con-foto .eslogan{color:#F4ECE1}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--rojo);color:#fff;text-decoration:none;
  font-weight:700;font-size:.95rem;padding:13px 26px;border-radius:999px;margin-top:28px;border:0;cursor:pointer}
.btn:hover{background:var(--vino-oscuro)}

/* Carta */
.seccion{padding-block:64px}
.titulo{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,6vw,2.6rem);text-align:center;line-height:1.1}
.bajada{text-align:center;color:var(--grano);margin:10px auto 0;max-width:46ch}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:36px}
@media (min-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:20px}}
.cat{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;text-decoration:none;color:#fff;
  background:radial-gradient(circle at 70% 30%,#6B4A35,#2E1D14 75%)}
.cat img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.cat:hover img{transform:scale(1.05)}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(30,18,12,.85))}
.cat span{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;font-family:var(--serif);font-weight:600;font-size:clamp(1.15rem,3.6vw,1.45rem);line-height:1.1}

/* Vista de categoría */
.volver{display:inline-flex;align-items:center;gap:6px;background:none;border:0;cursor:pointer;
  font:600 .9rem var(--sans);color:var(--grano);text-decoration:none;padding:6px 0}
.volver:hover{color:var(--vino)}
.cabeza{display:flex;gap:20px;align-items:flex-end;margin:18px 0 26px}
.cabeza h2{font-family:var(--serif);font-weight:600;font-size:clamp(2.2rem,7vw,3rem);line-height:1}
.cabeza p{color:var(--grano);margin-top:6px}
.cabeza .foto{display:none;width:220px;aspect-ratio:4/3;border-radius:14px;object-fit:cover;margin-left:auto}
@media (min-width:720px){.cabeza .foto{display:block}}
.lista{list-style:none;background:var(--papel);border:1px solid var(--linea);border-radius:16px;padding:6px 18px}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--linea)}
.item:last-child{border-bottom:0}
.subcat{list-style:none;font-family:var(--serif);font-weight:600;font-size:1.45rem;color:var(--vino);padding:22px 0 8px;border-bottom:1px solid var(--linea)}
.subcat:first-child{padding-top:12px}
.item .mini{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--crema)}
.item .letra{width:64px;height:64px;border-radius:12px;display:grid;place-items:center;
  background:var(--crema);color:var(--vino);font:700 1.6rem var(--serif)}
.item h3{font-family:var(--serif);font-weight:600;font-size:1.25rem;line-height:1.15}
.item p{color:var(--grano);font-size:.88rem;margin-top:2px;max-width:52ch}
.item .precio{font-weight:700;color:var(--vino);white-space:nowrap;align-self:start;padding-top:2px}

/* Historia y contacto */
.historia{background:var(--cafe);color:#F4ECE1;text-align:center}
.historia .titulo{color:#fff}
.historia p{max-width:58ch;margin:18px auto 0;font-family:var(--serif);font-size:1.25rem;line-height:1.6}
.contacto{text-align:center}
.contacto .eslogan{font-family:var(--script);font-size:2rem;line-height:1.2;color:var(--grano);margin-top:6px}
.redes{display:flex;flex-wrap:wrap;justify-content:center;gap:20px clamp(14px,5vw,56px);margin-top:28px}
.redes a{width:72px;text-align:center;line-height:1.25}
.redes a{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;font-size:.9rem;font-weight:600;color:var(--cafe)}
.redes .circulo{width:58px;height:58px;border-radius:50%;border:1.5px solid var(--vino);display:grid;place-items:center;color:var(--vino)}
.redes a:hover .circulo{background:var(--vino);color:#fff}
.redes svg{width:26px;height:26px}
footer{text-align:center;font-size:.8rem;color:var(--grano);padding:24px 20px 32px}

.estado{text-align:center;padding:120px 20px;color:var(--grano)}
.oculto{display:none!important}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.cat img{transition:none}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="marca" href="#inicio" id="marcaTop">NUESTRO</a>
    <nav aria-label="Secciones">
      <a href="#carta">Carta</a>
      <a href="#historia">Historia</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </div>
</header>

<div id="estado" class="estado">Cargando la carta…</div>

<main id="inicio" class="oculto">
  <section class="hero" id="hero">
    <h1><img class="logo" src="img/logo.png" alt="NUESTRO, Café de Santa Bárbara" width="640" height="330"></h1>
    <p class="eslogan" data-info="eslogan"></p>
    <a class="btn" href="#carta">Ver nuestra carta</a>
    <svg class="montes" viewBox="0 0 1200 160" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M0 150 L140 70 L230 120 L380 30 L520 115 L640 60 L760 125 L900 45 L1040 110 L1200 65"/>
      <path d="M0 158 L180 105 L300 140 L450 85 L600 145 L780 95 L950 150 L1200 100" opacity=".6"/>
    </svg>
  </section>

  <section class="seccion" id="carta">
    <div class="wrap">
      <h2 class="titulo">Nuestra carta</h2>
      <p class="bajada" data-info="intro_carta"></p>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section class="seccion historia" id="historia">
    <div class="wrap">
      <h2 class="titulo">Nuestra historia</h2>
      <p data-info="historia"></p>
    </div>
  </section>

  <section class="seccion contacto" id="contacto">
    <div class="wrap">
      <h2><img class="logo" src="img/logo.png" alt="NUESTRO, Café de Santa Bárbara" loading="lazy" width="640" height="330"></h2>
      <p class="eslogan" data-info="eslogan"></p>
      <div class="redes">
        <a id="lnkMapa" target="_blank" rel="noopener">
          <span class="circulo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>
          Cómo llegar
        </a>
        <a id="lnkWpp" target="_blank" rel="noopener">
          <span class="circulo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20l1.3-4A8 8 0 1 1 8.2 19z"/><path d="M9 8.5c0 3.5 2.5 6.5 6.5 6.5l1-1.6-2-1-1 .9c-1.2-.5-2.2-1.5-2.7-2.7l.9-1-1-2z" fill="currentColor" stroke="none"/></svg></span>
          WhatsApp
        </a>
        <a id="lnkIg" target="_blank" rel="noopener">
          <span class="circulo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="4.5"/><circle cx="12" cy="12" r="3.6"/><circle cx="16.9" cy="7.1" r=".9" fill="currentColor"/></svg></span>
          Instagram
        </a>
        <a id="lnkFb" target="_blank" rel="noopener">
  <span class="circulo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 8h2.5V4.5H14A3.5 3.5 0 0 0 10.5 8v2.5H8V14h2.5v6H14v-6h2.5l.5-3.5h-3V8.5a.5.5 0 0 1 .5-.5z"/></svg></span>
  Facebook
</a>
      </div>
    </div>
  </section>
</main>

<main id="vistaCategoria" class="oculto">
  <div class="wrap seccion" style="padding-top:28px">
    <a class="volver" href="#carta">← Volver a la carta</a>
    <div class="cabeza">
      <div>
        <h2 id="catNombre"></h2>
        <p id="catSub"></p>
      </div>
      <img class="foto" id="catFoto" alt="">
    </div>
    <ul class="lista" id="lista"></ul>
  </div>
</main>

<footer data-footer></footer>

<script>
// Enlaces de Google Sheets publicados como CSV
const BASE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQxUlWZGlna_454draUpia2Wur-3uZg_7kkeoKH6Nqsb7vG2wFEsJhs7MRzFF2itIyqIcLeOUdZ5khG/pub";
const GID = { info: "2109041954", categorias: "893191367", platos: "988201768" };
const urlHoja = g => `${BASE}?gid=${g}&single=true&output=csv`;

let INFO = {}, CATS = [], PLATOS = [];

// Lector de CSV que respeta comillas y comas dentro de los textos
function parseCSV(texto){
  const filas = []; let fila = [], campo = "", comillas = false;
  for (let i = 0; i < texto.length; i++){
    const c = texto[i];
    if (comillas){
      if (c === '"' && texto[i+1] === '"'){ campo += '"'; i++; }
      else if (c === '"') comillas = false;
      else campo += c;
    } else if (c === '"') comillas = true;
    else if (c === ",") { fila.push(campo); campo = ""; }
    else if (c === "\n") { fila.push(campo); filas.push(fila); fila = []; campo = ""; }
    else if (c !== "\r") campo += c;
  }
  if (campo !== "" || fila.length){ fila.push(campo); filas.push(fila); }
  const [cab, ...resto] = filas;
  return resto.filter(f => f.some(v => v.trim() !== ""))
              .map(f => Object.fromEntries(cab.map((k, i) => [k.trim(), (f[i] || "").trim()])));
}

const leer = g => fetch(urlHoja(g)).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(parseCSV);
const precio = v => "$" + Number(v || 0).toLocaleString("es-CO");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function pintarInicio(){
  document.querySelectorAll("[data-info]").forEach(el => el.textContent = INFO[el.dataset.info] || "");
  document.querySelector("[data-footer]").textContent = `${INFO.nombre || ""} · ${INFO.subtitulo || ""}`;
  document.getElementById("lnkMapa").href = INFO.como_llegar || "#";
  document.getElementById("lnkWpp").href = INFO.whatsapp ? `https://wa.me/${INFO.whatsapp.replace(/\D/g,"")}` : "#";
  document.getElementById("lnkIg").href = INFO.instagram || "#";
  document.getElementById("lnkFb").href = INFO.facebook || "#";

  // Si existe img/hero.jpg se usa como fondo de la portada
  const foto = new Image();
  foto.onload = () => { const h = document.getElementById("hero"); h.style.backgroundImage = "url(img/hero.jpg)"; h.classList.add("con-foto"); };
  foto.src = "img/hero.jpg";

  document.getElementById("grid").innerHTML = CATS.map(c => `
    <a class="cat" href="#/c/${esc(c.id)}">
      ${c.imagen ? `<img src="${esc(c.imagen)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
      <span>${esc(c.nombre)}</span>
    </a>`).join("");
}

function pintarCategoria(id){
  const c = CATS.find(x => x.id === id);
  if (!c){ location.hash = "#carta"; return; }
  document.getElementById("catNombre").textContent = c.nombre;
  document.getElementById("catSub").textContent = c.subtitulo || "";
  const foto = document.getElementById("catFoto");
  foto.classList.remove("oculto");
  foto.onerror = () => foto.classList.add("oculto");
  foto.src = c.imagen || "";
  const items = PLATOS.filter(p => p.categoria === id && (p.disponible || "SI").toUpperCase() !== "NO")
                      .sort((a, b) => Number(a.orden) - Number(b.orden));
  const fila = p => {
    const letra = esc(p.nombre.charAt(0));
    const img = p.imagen
      ? `<img class="mini" src="${esc(p.imagen)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;letra&quot;>${letra}</div>'">`
      : `<div class="letra">${letra}</div>`;
    return `<li class="item">${img}
      <div><h3>${esc(p.nombre)}</h3>${p.descripcion ? `<p>${esc(p.descripcion)}</p>` : ""}</div>
      <span class="precio">${precio(p.precio)}</span></li>`;
  };
  // Agrupa por subcategoría en el orden en que aparecen
  const grupos = [];
  items.forEach(p => {
    const s = (p.subcategoria || "").trim();
    let g = grupos.find(x => x.s === s);
    if (!g){ g = { s, items: [] }; grupos.push(g); }
    g.items.push(p);
  });
  document.getElementById("lista").innerHTML = grupos.map(g =>
    (g.s ? `<li class="subcat">${esc(g.s)}</li>` : "") + g.items.map(fila).join("")
  ).join("") || `<li class="item" style="grid-template-columns:1fr">No hay productos disponibles en esta sección por ahora.</li>`;
}

function ruta(){
  const h = location.hash;
  const enCategoria = h.startsWith("#/c/");
  document.getElementById("inicio").classList.toggle("oculto", enCategoria);
  document.getElementById("vistaCategoria").classList.toggle("oculto", !enCategoria);
  if (enCategoria){ pintarCategoria(decodeURIComponent(h.slice(4))); window.scrollTo(0, 0); }
  else if (h){ const el = document.querySelector(h); if (el) el.scrollIntoView(); }
}

Promise.all([leer(GID.info), leer(GID.categorias), leer(GID.platos)])
  .then(([info, cats, platos]) => {
    INFO = Object.fromEntries(info.map(r => [r.clave, r.valor]));
    CATS = cats.sort((a, b) => Number(a.orden) - Number(b.orden));
    PLATOS = platos;
    document.title = `${INFO.nombre || "Menú"} · ${INFO.subtitulo || ""}`;
    pintarInicio();
    document.getElementById("estado").classList.add("oculto");
    ruta();
  })
  .catch(() => {
    document.getElementById("estado").textContent = "No se pudo cargar la carta. Revisa tu conexión y recarga la página.";
  });

window.addEventListener("hashchange", ruta);
</script>
</body>
</html>
